name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Bicep compiler
        run: az bicep install --version v0.46.1
      - name: Compile private foundation template
        run: az bicep build --file infra/foundation.bicep --stdout > /dev/null
      - name: Compile application and chase worker template
        run: az bicep build --file infra/app.bicep --stdout > /dev/null

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cosmaneura_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cosmaneura_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COSMANEURA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cosmaneura_test
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        working-directory: cosmaneura_billing
        run: python -m pip install -e ".[dev]"
      - name: Run billing engine tests
        working-directory: cosmaneura_billing
        run: python -m pytest -v
      - name: Verify fail-closed PHI log scanner
        working-directory: cosmaneura_billing
        run: python -m cosmaneura_billing.log_scanner --self-test
      - name: Guardrail invariant proof
        working-directory: cosmaneura_billing
        run: python prove_no_upcode.py
      - name: Offline demo smoke test
        working-directory: cosmaneura_billing
        run: python run_demo.py

      - name: Insurance-chase demo smoke test
        working-directory: cosmaneura_billing
        run: python demo_chase.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build
        working-directory: cosmaneura_billing/frontend
        run: |
          npm ci
          npm run build

  container:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-disposable-password
      POSTGRES_URL_PASSWORD: ci-disposable-password
      POSTGRES_APP_PASSWORD: ci-disposable-app-password
      POSTGRES_APP_URL_PASSWORD: ci-disposable-app-password
      COSMANEURA_PRACTICE_ID: synthetic-ci
      COSMANEURA_ENTRA_TENANT_ID: 11111111-1111-4111-8111-111111111111
      COSMANEURA_BOOTSTRAP_ADMIN_OID: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the production topology
        working-directory: cosmaneura_billing
        run: docker compose up --build --wait
      - name: Verify installed-wheel regulatory data and readiness
        run: >-
          python -c "import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/ready'));
          assert data == {'status':'ready','ncciLoaded':True,'coverageLoaded':True}, data"
      - name: Verify protected API fails closed without an Entra principal
        run: >-
          python -c "import http.client;
          connection=http.client.HTTPConnection('127.0.0.1',8000);
          connection.request('GET','/api/health'); response=connection.getresponse();
          assert response.status == 401, response.status;
          assert response.getheader('WWW-Authenticate') == 'Bearer'"
      - name: Stop the disposable topology
        if: always()
        working-directory: cosmaneura_billing
        run: docker compose down --volumes
