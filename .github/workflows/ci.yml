name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest numpy fastapi uvicorn httpx
      - name: Run billing engine tests
        working-directory: cosmaneura_billing
        run: python -m pytest -v
      - name: Guardrail invariant proof
        working-directory: cosmaneura_billing
        run: python prove_no_upcode.py
      - name: Offline demo smoke test
        working-directory: cosmaneura_billing
        run: python run_demo.py

      - name: Insurance-chase demo smoke test
        working-directory: cosmaneura_billing
        run: python demo_chase.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build
        working-directory: cosmaneura_billing/frontend
        run: |
          npm ci
          npm run build
