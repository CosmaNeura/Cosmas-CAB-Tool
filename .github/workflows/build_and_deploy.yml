name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact, independently reviewed commit currently at main
        required: true
        type: string
      agent_review_url:
        description: PR comment URL containing the independent-agent review record
        required: true
        type: string
      confirmation:
        description: Type BUILD AND DEPLOY CAB PILOT
        required: true
        type: string

# No job receives a token scope unless it declares one below. The authorization
# dependency is deliberately permissionless and never resolves protected values.
permissions: {}

concurrency:
  group: cab-pilot-production
  cancel-in-progress: false

jobs:
  authorize-production:
    name: Authorize founder promotion
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require founder-authorized manual run from main
        env:
          ACTOR: ${{ github.actor }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = "workflow_dispatch"
          test "$REPOSITORY" = "CosmaNeura/Cosmas-CAB-Tool"
          test "$WORKFLOW_REF" = "refs/heads/main"
          test "$ACTOR" = "JohnClem"
          test "$TRIGGERING_ACTOR" = "JohnClem"
          test "$CONFIRMATION" = "BUILD AND DEPLOY CAB PILOT"

  build-publish:
    name: Build & publish immutable image
    needs: authorize-production
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'JohnClem' &&
        github.triggering_actor == 'JohnClem' &&
        needs.authorize-production.result == 'success' &&
        vars.AZURE_CLIENT_ID != ''
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE_REPO: cosmaneura-billing
      REGISTRY: ${{ vars.CAB_REGISTRY_HOST || 'cosmaneurapiloti4akwqry.azurecr.io' }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Verify current main and independent-agent review
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          REVIEW_URL: ${{ inputs.agent_review_url }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.ref }}
        run: bash .github/scripts/verify-cab-release.sh

      - name: Build the reviewed image without cloud credentials
        working-directory: cosmaneura_billing
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_REPO}:${GITHUB_SHA}"
          docker build -t "$image" .

      - name: Reverify current main before requesting cloud credentials
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$RELEASE_SHA"

      - name: Sign in to Azure with workload identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Registry login (managed identity, no admin credential)
        run: az acr login --name "${REGISTRY%%.*}"

      - name: Reverify current main, then publish the immutable image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$RELEASE_SHA"

          image="${REGISTRY}/${IMAGE_REPO}:${RELEASE_SHA}"
          docker push "$image"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image" | cut -d@ -f2)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Bad digest: $digest" >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Commit ${RELEASE_SHA} -> ${digest}"

      - name: Record provenance
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          REVIEW_URL: ${{ inputs.agent_review_url }}
        run: |
          {
            echo "### Image provenance"
            echo
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Independent-agent review: $REVIEW_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy pilot
    needs: [authorize-production, build-publish]
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'JohnClem' &&
        github.triggering_actor == 'JohnClem' &&
        needs.authorize-production.result == 'success' &&
        needs.build-publish.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pilot
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    env:
      API_APP: ${{ vars.CAB_API_APP || 'cosmaneura-pilot-api-i4akwqry' }}
      DIGEST: ${{ needs.build-publish.outputs.digest }}
      IMAGE_REPO: cosmaneura-billing
      MIGRATION_JOB: ${{ vars.CAB_MIGRATION_JOB || 'cosmaneura-pilot-mig-i4akwqry' }}
      REGISTRY: ${{ vars.CAB_REGISTRY_HOST || 'cosmaneurapiloti4akwqry.azurecr.io' }}
      RESOURCE_GROUP: ${{ vars.CAB_RESOURCE_GROUP || 'cosmaneura-cab-pilot' }}
      WORKER_JOB: ${{ vars.CAB_WORKER_JOB || 'cosmaneura-pilot-wrk-i4akwqry' }}
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Verify current main and independent-agent review again
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          REVIEW_URL: ${{ inputs.agent_review_url }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.ref }}
        run: bash .github/scripts/verify-cab-release.sh

      - name: Require the deploy latch and an immutable digest
        env:
          DEPLOY_ENABLED: ${{ vars.CAB_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          test "$DEPLOY_ENABLED" = "true"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Sign in to Azure with workload identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Record the messaging gates before deploying
        run: |
          set -euo pipefail
          az containerapp job show -n "$WORKER_JOB" -g "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?contains(name,'PATIENT_MESSAGING')].{n:name,v:value}" \
            -o table | tee gates-before.txt

      - name: Reverify current main before migration mutation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$RELEASE_SHA"

      - name: Run the ordered-SQL migration job
        run: |
          set -euo pipefail
          az containerapp job update -n "$MIGRATION_JOB" -g "$RESOURCE_GROUP" \
            --image "${REGISTRY}/${IMAGE_REPO}@${DIGEST}" -o none
          exec_name="$(az containerapp job start -n "$MIGRATION_JOB" -g "$RESOURCE_GROUP" --query name -o tsv)"
          echo "Migration execution: $exec_name"
          for _ in $(seq 1 60); do
            status="$(az containerapp job execution show -n "$MIGRATION_JOB" -g "$RESOURCE_GROUP" \
              --job-execution-name "$exec_name" --query properties.status -o tsv)"
            case "$status" in
              Succeeded) echo "Migration succeeded."; break ;;
              Failed|Degraded) echo "Migration $status - not deploying." >&2; exit 1 ;;
            esac
            sleep 10
          done
          test "$status" = "Succeeded" || {
            echo "Migration timed out." >&2
            exit 1
          }

      - name: Reverify current main before application mutation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$RELEASE_SHA"

      - name: Deploy API and chase worker at the same digest
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_REPO}@${DIGEST}"
          az containerapp update -n "$API_APP" -g "$RESOURCE_GROUP" --image "$image" -o none
          az containerapp job update -n "$WORKER_JOB" -g "$RESOURCE_GROUP" --image "$image" -o none

      - name: Verify the messaging gates are unchanged
        run: |
          set -euo pipefail
          az containerapp job show -n "$WORKER_JOB" -g "$RESOURCE_GROUP" \
            --query "properties.template.containers[0].env[?contains(name,'PATIENT_MESSAGING')].{n:name,v:value}" \
            -o table > gates-after.txt
          diff gates-before.txt gates-after.txt || {
            echo "Messaging gates changed during deploy. This must never happen." >&2
            exit 1
          }
          echo "Messaging gates unchanged."

      - name: Smoke - protected API must fail closed
        run: |
          set -euo pipefail
          fqdn="$(az containerapp show -n "$API_APP" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://${fqdn}/api/health" || echo 000)"
          test "$code" = "401" || {
            echo "Expected 401 without a principal, got $code" >&2
            exit 1
          }
          echo "Fail-closed verified (401)."

      - name: Record deployment evidence
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          REVIEW_URL: ${{ inputs.agent_review_url }}
        run: |
          {
            echo "### Deployed"
            echo
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Independent-agent review: $REVIEW_URL"
            echo "- Messaging gates: unchanged, verified"
          } >> "$GITHUB_STEP_SUMMARY"
