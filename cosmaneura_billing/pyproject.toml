[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmaneura-billing"
version = "0.1.0"
description = "CosmaNeura agentic billing layer: multi-agent pipeline turning finished visits into auditable billing codes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# The core engine is deliberately dependency-free (stdlib only).
dependencies = []

[project.optional-dependencies]
# LocalVectorStore / dialogue RAG (feature3 replacement)
vector = ["numpy>=1.24"]
# iCliniq corpus loading + feather I/O
corpus = ["pandas>=2.0", "pyarrow>=14"]
# the demo/pilot API service (cosmaneura_billing.api)
api = ["fastapi>=0.110", "uvicorn>=0.30"]
# Dedicated Core workload verifier; disabled until separately configured.
core_bridge = ["pyjwt[crypto]>=2.13,<3", "azure-identity>=1.17,<2"]
# durable chase / feedback persistence in the practice's PostgreSQL server
postgres = ["psycopg[binary]>=3.2,<4"]
# Live billing inference: official OpenAI SDK against Azure OpenAI, authenticated
# with the API's user-assigned managed identity. No API-key auth is supported.
inference = [
    "openai>=1.109,<3",
    "azure-identity>=1.17,<2",
]
# Second extraction engine: Azure AI Language (Text Analytics for health),
# authenticated with the API's user-assigned managed identity. The transport is
# stdlib urllib, so only the credential library is required. No API-key auth is
# supported.
language = ["azure-identity>=1.17,<2"]
# Patient email delivery from the P4 scheduler. The API remains transport-inert.
messaging = ["azure-communication-email>=1.1,<2"]
# Explicit numeric metrics only.  No Azure/OpenTelemetry auto-instrumentation is
# installed or enabled because generic HTTP/SQL/exception capture can cross the
# PHI logging boundary before redaction.
telemetry = [
    "azure-identity>=1.17,<2",
    "azure-monitor-opentelemetry-exporter>=1.0.0b36,<2",
    "opentelemetry-sdk>=1.27,<2",
]
dev = [
    "pytest>=8",
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2,<4",
    "openai>=1.109,<3",
    "azure-identity>=1.17,<2",
    "azure-monitor-opentelemetry-exporter>=1.0.0b36,<2",
    "opentelemetry-sdk>=1.27,<2",
]

[tool.setuptools.packages.find]
include = ["cosmaneura_billing*"]

[tool.setuptools.package-data]
"cosmaneura_billing" = [
    "data/*.csv",
    "data/*.csv.gz",
    "data/*.md",
    "data/corpora/acibench_train.csv",
    "data/corpora/acibench_valid.csv",
    "data/corpora/*.md",
    "data/demo_release_candidate/*.json",
    "data/demo_source_extension/*.json",
    "data/mcd_training/*.json",
    "data/mcd_training/*.md",
    "data/synthetic_chase/*.json",
    "data/mcd/*.csv.gz",
    "data/mcd/*.md",
    "data/ncci/*.tsv.gz",
    "data/ncci/*.json.gz",
    "data/ncci/*.md",
    "benchmarks/data/*.csv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
